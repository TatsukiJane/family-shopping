name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно деплоим только одну сборку, но начатую не отменяем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      # enablement: true переключает источник Pages на GitHub Actions через API.
      # Без флага шаг только читает конфигурацию: если в настройках стоит
      # «Deploy from a branch», деплой создаётся и тут же получает
      # «Deployment cancelled», хотя сборка зелёная.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: pnpm build
        env:
          # Сайт живёт по пути /<repo>/ — иначе ассеты и manifest не найдутся.
          BASE_PATH: /${{ github.event.repository.name }}/
          # Координаты приватного репозитория с данными. Это не секреты:
          # токена в бандле нет, доступ даёт только PAT на устройстве.
          VITE_DATA_OWNER: ${{ vars.VITE_DATA_OWNER }}
          VITE_DATA_REPO: ${{ vars.VITE_DATA_REPO }}
          VITE_DATA_BRANCH: ${{ vars.VITE_DATA_BRANCH || 'main' }}
          VITE_DATA_PATH: ${{ vars.VITE_DATA_PATH || 'data/list.json' }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Своего таймаута тут нет намеренно: у deploy-pages есть внутренний (10 мин),
    # и он печатает настоящую причину. Внешний таймаут убивал шаг раньше
    # и оставлял в логе бесполезное «cancelled» вместо диагностики.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
